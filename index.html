<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAZM&GAMES | استودیوی بازی و برنامه</title>
<meta name="description" content="RAZM&GAMES؛ استودیوی ساخت بازی و برنامه">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<script>
(function(){var t=null;try{t=localStorage.getItem('rg_theme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{
  --bg:#eef1f3;--sf:#ffffff;--sf2:#e4e9ed;--tx:#14212b;--mu:#566673;
  --ac:#a8650a;--ac-tx:#ffffff;--sg:#c0412a;--bd:#d0d8de;--r:14px;
  --font:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0e171e;--sf:#16232d;--sf2:#1d2e3a;--tx:#e8edf1;--mu:#93a4b1;
  --ac:#e8b04a;--ac-tx:#1a1205;--sg:#e5684e;--bd:#2a3d4b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.9;font-size:16px;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{width:min(1120px,92%);margin-inline:auto}

/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px}
.logo{font-weight:900;font-size:21px;letter-spacing:.5px;direction:ltr;white-space:nowrap}
.logo i{font-style:normal;color:var(--sg)}
nav{display:flex;gap:6px;margin-inline-start:auto;overflow-x:auto}
nav a{padding:6px 14px;border-radius:999px;color:var(--mu);font-weight:600;font-size:15px;white-space:nowrap;transition:.2s}
nav a:hover{color:var(--tx);background:var(--sf2)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);cursor:pointer;font-size:18px;flex:none;transition:.2s}
.icon-btn:hover{border-color:var(--ac)}

/* hero / banners */
#hero{position:relative;height:min(68vh,560px);min-height:380px;overflow:hidden;background:var(--sf2)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;display:flex;align-items:flex-end}
.slide.on{opacity:1;visibility:visible}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,12,16,.88) 8%,rgba(6,12,16,.35) 55%,rgba(6,12,16,.1))}
.sc{position:relative;width:min(1120px,92%);margin-inline:auto;padding-bottom:64px;color:#fff;max-width:1120px}
.sc>*{max-width:640px}
.sc h1,.sc h2{font-size:clamp(30px,5.5vw,58px);font-weight:900;line-height:1.35;margin-bottom:10px}
.sc p{font-size:clamp(15px,2vw,18px);opacity:.92;margin-bottom:22px}
.slide.on .sc h1,.slide.on .sc h2{animation:rise .8s .1s both cubic-bezier(.2,.7,.2,1)}
.slide.on .sc p,.slide.on .sc a{animation:rise .8s .25s both cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:var(--ac-tx);border:0;border-radius:10px;padding:10px 22px;font-weight:800;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.sm{padding:5px 14px;font-size:14px;border-radius:8px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.ghost:hover{border-color:var(--ac)}
.btn.danger{background:var(--sg);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hctl{position:absolute;inset-inline:0;bottom:20px;display:flex;justify-content:center;gap:8px;z-index:3}
.dot{width:10px;height:10px;border-radius:99px;border:0;background:rgba(255,255,255,.45);cursor:pointer;transition:.3s}
.dot.on{width:30px;background:var(--ac)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:rgba(10,18,24,.5);color:#fff;font-size:20px;cursor:pointer}
.arrow:hover{background:rgba(10,18,24,.8)}
.arrow.prev{right:14px}.arrow.next{left:14px}
.hero-empty{height:100%;display:grid;place-content:center;text-align:center;gap:8px}
.hero-empty h1{font-size:clamp(34px,7vw,64px);font-weight:900;direction:ltr}

/* sections */
section.blk{padding:72px 0 8px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.sh::before{content:"";width:8px;height:34px;background:var(--ac);border-radius:3px;transform:skewX(-14deg)}
.sh h2{font-size:clamp(22px,3.4vw,32px);font-weight:900}
.empty{color:var(--mu);padding:30px;border:1px dashed var(--bd);border-radius:var(--r);text-align:center}

/* news */
.news{display:grid;gap:0;border-top:1px solid var(--bd)}
.nitem{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:22px 4px;border-bottom:1px solid var(--bd)}
.nitem time{color:var(--ac);font-weight:700;font-size:15px}
.nitem h3{font-size:19px;font-weight:800;margin-bottom:4px}
.nitem p{color:var(--mu)}
@media(max-width:640px){.nitem{grid-template-columns:1fr;gap:2px}}

/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
a.card:hover{border-color:var(--ac);transform:translateY(-3px)}
.card .ph{aspect-ratio:16/9;background:var(--sf2);display:grid;place-items:center;font-size:54px;font-weight:900;color:var(--ac);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .cb{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:19px;font-weight:800}
.card p{color:var(--mu);font-size:15px;flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mu)}
.badge{padding:1px 10px;border-radius:99px;background:var(--sf2);font-weight:700;color:var(--tx)}
.badge.live{background:var(--ac);color:var(--ac-tx)}
@media(min-width:900px){.grid .card:first-child:nth-last-child(n+3){grid-column:span 2}.grid .card:first-child:nth-last-child(n+3) .ph{aspect-ratio:21/9}}

/* about */
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:start}
.about p{white-space:pre-line;font-size:17px}
.links{display:grid;gap:10px}
.links a{display:flex;justify-content:space-between;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 18px;direction:ltr;transition:.2s}
.links a:hover{border-color:var(--ac)}
.links span{color:var(--mu)}
@media(max-width:760px){.about{grid-template-columns:1fr}}
footer{margin-top:80px;border-top:1px solid var(--bd);padding:26px 0;color:var(--mu);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
footer button{background:none;border:0;color:var(--mu);cursor:pointer;text-decoration:underline}

/* admin */
#adm{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
.apanel{width:min(900px,94%);margin:0 auto;padding:22px 0 80px}
.abar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.abar h2{font-size:22px;font-weight:900;margin-inline-end:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--bd);padding-bottom:12px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--mu)}
.tabs button.on{background:var(--ac);color:var(--ac-tx)}
.row{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.row.off{opacity:.55}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mu)}
.ra{display:flex;gap:6px;flex-wrap:wrap}
.ra button{border:1px solid var(--bd);background:var(--sf2);border-radius:8px;padding:3px 11px;cursor:pointer;font-size:14px}
.ra button:hover:not(:disabled){border-color:var(--ac)}
.ra button:disabled{opacity:.35;cursor:not-allowed}
.ra button.armed{background:var(--sg);color:#fff;border-color:var(--sg)}
.fbox{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:22px;display:grid;gap:14px}
.fbox label.f{display:grid;gap:5px;font-weight:700;font-size:14px}
.fbox input[type=text],.fbox input[type=url],.fbox input[type=password],.fbox input[type=date],.fbox input[type=email],.fbox textarea,.fbox select{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);font-weight:400}
.fbox input[type=color]{width:60px;height:38px;border:1px solid var(--bd);border-radius:8px;background:none;padding:2px}
.fbox .chk{display:flex;gap:8px;align-items:center;font-weight:700}
.fbox .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.fbox .two{grid-template-columns:1fr}}
.img-f{display:grid;gap:8px}
.img-f .prev{height:110px;border:1px dashed var(--bd);border-radius:10px;display:grid;place-items:center;color:var(--mu);font-weight:400;overflow:hidden}
.img-f .prev img{height:100%;width:100%;object-fit:cover}
.fact{display:flex;gap:10px;flex-wrap:wrap}
.login{width:min(420px,92%);margin:12vh auto 0}
.err{color:var(--sg);font-weight:700;min-height:1.6em}
.note{color:var(--mu);font-size:14px}
.toast{position:fixed;bottom:22px;inset-inline:0;margin-inline:auto;width:fit-content;max-width:90%;background:var(--tx);color:var(--bg);padding:10px 22px;border-radius:999px;z-index:200;font-weight:700;animation:rise .3s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" id="logo"></a>
    <nav aria-label="منو">
      <a href="#news">اخبار</a><a href="#projects">پروژه‌ها</a><a href="#about">درباره ما</a>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="تغییر حالت تاریک و روشن"></button>
  </div>
</header>

<main id="top">
  <div id="hero" aria-roledescription="carousel" aria-label="بنرها"></div>
  <div class="wrap">
    <section class="blk" id="news"><div class="sh"><h2>آخرین اخبار</h2></div><div class="news" id="newsList"></div></section>
    <section class="blk" id="projects"><div class="sh"><h2>بازی‌ها و برنامه‌ها</h2></div><div class="grid" id="projList"></div></section>
    <section class="blk" id="about"><div class="sh"><h2>درباره ما</h2></div><div class="about"><p id="aboutTxt"></p><div class="links" id="contact"></div></div></section>
  </div>
</main>

<footer>
  <div class="wrap"><span id="footTxt"></span><button id="admOpen">ورود مدیر</button></div>
</footer>

<div id="adm" hidden></div>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const okUrl=u=>{u=String(u||'').trim();
  if(!u||/^(javascript|vbscript|data):/i.test(u))return '';
  if(/^(https?:|mailto:|tel:|#|\/|\.\/|\.\.\/)/i.test(u))return u;
  if(/^[\w\-\/]+\.html?(#.*)?$/i.test(u))return u;
  return 'https://'+u};
const okImg=u=>{u=String(u||'').trim();return /^(https?:|data:image\/|\/|\.\/|[\w-]+\.[a-z]{3,4}$)/i.test(u)?u:''};
const okColor=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#1d3b4f';
const store={m:{},get(k){try{return localStorage.getItem(k)}catch(e){return this.m[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){this.m[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete this.m[k]}}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function fdate(d){try{return new Date(d).toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'})}catch(e){return d}}

/* ---------- data ---------- */
const KEY='rg_data',AUTHKEY='rg_auth';
const DEFAULT={
  settings:{
    name:'RAZM&GAMES',tagline:'استودیوی بازی و برنامه',
    about:'RAZM&GAMES یک استودیوی ساخت بازی و برنامه است.\nاین متن را از پنل مدیریت، بخش «تنظیمات سایت» تغییر بدهید.',
    footer:'© RAZM&GAMES — همه حقوق محفوظ است.',telegram:'',instagram:'',email:''
  },
  banners:[
    {id:'b1',title:'به RAZM&GAMES خوش آمدید',text:'بازی‌ها و برنامه‌های ما را اینجا ببینید.',link:'#projects',btn:'مشاهده پروژه‌ها',img:'',color:'#1d3b4f',visible:true},
    {id:'b2',title:'خبر تازه',text:'این بنر را از پنل مدیریت ویرایش، پنهان یا حذف کنید.',link:'#news',btn:'اخبار',img:'',color:'#5a2a1f',visible:true}
  ],
  news:[{id:'n1',title:'راه‌اندازی سایت',text:'سایت رسمی استودیو راه‌اندازی شد.',date:today(),visible:true}],
  projects:[{id:'p1',name:'پروژهٔ نمونه',cat:'بازی',desc:'توضیح کوتاه پروژه. از پنل مدیریت ویرایشش کنید.',status:'در حال توسعه',link:'',img:'',visible:true}]
};
let DATA=JSON.parse(JSON.stringify(DEFAULT));
function merge(d){const o=JSON.parse(JSON.stringify(DEFAULT));
  if(d&&typeof d==='object'){Object.assign(o.settings,d.settings||{});['banners','news','projects'].forEach(k=>{if(Array.isArray(d[k]))o[k]=d[k]})}
  return o}
async function load(){
  let d=null;const l=store.get(KEY);
  if(l){try{d=JSON.parse(l)}catch(e){}}
  if(!d){try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}}
  DATA=merge(d);
}
function save(){
  try{store.set(KEY,JSON.stringify(DATA))}catch(e){toast('ذخیره نشد؛ احتمالاً حجم تصاویر زیاد است')}
  render();
}

/* ---------- public render ---------- */
let cur=0,timer=null;
function render(){
  const S=DATA.settings;
  document.title=S.name+' | '+S.tagline;
  const parts=S.name.split('&');
  $('#logo').innerHTML=parts.length>1?esc(parts[0])+'<i>&amp;</i>'+esc(parts.slice(1).join('&')):esc(S.name);
  renderHero();
  const news=DATA.news.filter(n=>n.visible!==false).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $('#newsList').innerHTML=news.length?news.map(n=>`<article class="nitem"><time datetime="${esc(n.date)}">${esc(fdate(n.date))}</time><div><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></div></article>`).join(''):'<div class="empty">هنوز خبری منتشر نشده است.</div>';
  const pr=DATA.projects.filter(p=>p.visible!==false);
  $('#projList').innerHTML=pr.length?pr.map(p=>{
    const link=okUrl(p.link),tag=link?'a':'div',href=link?` href="${esc(link)}"`:'';
    const img=okImg(p.img);
    return `<${tag} class="card"${href}><div class="ph">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:esc((p.name||'؟').trim().charAt(0))}</div><div class="cb"><div class="meta">${p.cat?`<span>${esc(p.cat)}</span>`:''}${p.status?`<span class="badge ${p.status==='منتشر شده'?'live':''}">${esc(p.status)}</span>`:''}</div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p></div></${tag}>`}).join(''):'<div class="empty">پروژه‌ای برای نمایش نیست.</div>';
  $('#aboutTxt').textContent=S.about;
  const cs=[];
  if(S.telegram)cs.push(['تلگرام',S.telegram,/^https?:/.test(S.telegram)?S.telegram:'https://t.me/'+S.telegram.replace('@','')]);
  if(S.instagram)cs.push(['اینستاگرام',S.instagram,/^https?:/.test(S.instagram)?S.instagram:'https://instagram.com/'+S.instagram.replace('@','')]);
  if(S.email)cs.push(['ایمیل',S.email,'mailto:'+S.email]);
  $('#contact').innerHTML=cs.map(c=>`<a href="${esc(okUrl(c[2]))}" target="_blank" rel="noopener"><b>${esc(c[1])}</b><span>${c[0]}</span></a>`).join('');
  $('#footTxt').textContent=S.footer;
}
function renderHero(){
  const el=$('#hero'),S=DATA.settings,bs=DATA.banners.filter(b=>b.visible!==false);
  clearInterval(timer);
  if(!bs.length){el.innerHTML=`<div class="hero-empty"><h1>${esc(S.name)}</h1><p>${esc(S.tagline)}</p></div>`;return}
  if(cur>=bs.length)cur=0;
  el.innerHTML=bs.map((b,i)=>{
    const img=okImg(b.img),link=okUrl(b.link),c=okColor(b.color);
    return `<article class="slide ${i===cur?'on':''}" style="background:linear-gradient(135deg,${c},color-mix(in srgb,${c} 45%,#000))" aria-hidden="${i!==cur}">${img?`<img class="bg" src="${esc(img)}" alt="">`:''}<div class="shade"></div><div class="sc"><${i===0?'h1':'h2'}>${esc(b.title)}</${i===0?'h1':'h2'}>${b.text?`<p>${esc(b.text)}</p>`:''}${b.btn?`<a class="btn" href="${esc(link||'#')}">${esc(b.btn)}</a>`:''}</div></article>`}).join('')
   +(bs.length>1?`<button class="arrow prev" aria-label="قبلی">›</button><button class="arrow next" aria-label="بعدی">‹</button><div class="hctl">${bs.map((_,i)=>`<button class="dot ${i===cur?'on':''}" data-i="${i}" aria-label="بنر ${i+1}"></button>`).join('')}</div>`:'');
  const go=n=>{cur=(n+bs.length)%bs.length;el.querySelectorAll('.slide').forEach((s,i)=>{s.classList.toggle('on',i===cur);s.setAttribute('aria-hidden',i!==cur)});el.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur))};
  el.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));
  const p=el.querySelector('.prev'),n=el.querySelector('.next');
  if(p){p.onclick=()=>go(cur-1);n.onclick=()=>go(cur+1)}
  if(bs.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    let hold=false;el.onmouseenter=()=>hold=true;el.onmouseleave=()=>hold=false;el.onfocusin=()=>hold=true;el.onfocusout=()=>hold=false;
    timer=setInterval(()=>{if(!hold)go(cur+1)},6500);
  }
}

/* theme */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);store.set('rg_theme',t);$('#themeBtn').textContent=t==='dark'?'☀':'☾'}
$('#themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
setTheme(document.documentElement.getAttribute('data-theme'));

/* ---------- admin: schema ---------- */
const STATUS=['منتشر شده','در حال توسعه','به‌زودی'];
const SCHEMA={
  banners:{label:'بنرها',title:'title',order:true,
    sub:b=>(b.btn?'دکمه: '+b.btn:'بدون دکمه'),
    blank:()=>({id:uid(),title:'',text:'',link:'',btn:'',img:'',color:'#1d3b4f',visible:true}),
    fields:[{k:'title',l:'عنوان',t:'text',r:1},{k:'text',l:'متن',t:'textarea'},{k:'img',l:'تصویر بنر',t:'image'},{k:'color',l:'رنگ پس‌زمینه (وقتی تصویر نیست)',t:'color'},
      {k:'btn',l:'متن دکمه (خالی = بدون دکمه)',t:'text'},{k:'link',l:'لینک دکمه',t:'url'},{k:'visible',l:'نمایش در سایت',t:'check'}]},
  news:{label:'اخبار',title:'title',sub:n=>fdate(n.date),
    blank:()=>({id:uid(),title:'',text:'',date:today(),visible:true}),
    fields:[{k:'title',l:'عنوان',t:'text',r:1},{k:'text',l:'متن خبر',t:'textarea'},{k:'date',l:'تاریخ',t:'date'},{k:'visible',l:'نمایش در سایت',t:'check'}]},
  projects:{label:'پروژه‌ها',title:'name',order:true,sub:p=>[p.cat,p.status].filter(Boolean).join(' — '),
    blank:()=>({id:uid(),name:'',cat:'بازی',desc:'',status:'در حال توسعه',link:'',img:'',visible:true}),
    fields:[{k:'name',l:'نام',t:'text',r:1},{k:'cat',l:'دسته (بازی، برنامه، ابزار…)',t:'text'},{k:'desc',l:'توضیح کوتاه',t:'textarea'},
      {k:'status',l:'وضعیت',t:'select',o:STATUS},{k:'img',l:'تصویر',t:'image'},{k:'link',l:'لینک (خالی = بدون لینک)',t:'url'},{k:'visible',l:'نمایش در سایت',t:'check'}]}
};
const SETTINGS_FIELDS=[{k:'name',l:'نام استودیو',t:'text',r:1},{k:'tagline',l:'شعار کوتاه',t:'text'},{k:'about',l:'متن درباره ما',t:'textarea'},
  {k:'telegram',l:'تلگرام (آیدی یا لینک)',t:'text'},{k:'instagram',l:'اینستاگرام (آیدی یا لینک)',t:'text'},{k:'email',l:'ایمیل',t:'email'},{k:'footer',l:'متن پایین سایت',t:'text'}];

/* ---------- admin: auth ---------- */
const enc=s=>new TextEncoder().encode(s);
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc(salt),iterations:150000,hash:'SHA-256'},k,256);
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=5381;for(const c of salt+pw)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h;
}
const getAuth=()=>{try{return JSON.parse(store.get(AUTHKEY))}catch(e){return null}};
const A={tab:'banners',edit:null,authed:false,fails:0,lock:0};
try{A.authed=sessionStorage.getItem('rg_sess')==='1'}catch(e){}
function setSess(v){A.authed=v;try{sessionStorage.setItem('rg_sess',v?'1':'0')}catch(e){}}

/* ---------- admin: render ---------- */
const adm=$('#adm');
function openAdmin(){adm.hidden=false;document.body.style.overflow='hidden';admRender()}
function closeAdmin(){adm.hidden=true;document.body.style.overflow='';if(location.hash==='#admin')history.replaceState(null,'',location.pathname)}
$('#admOpen').onclick=openAdmin;
if(location.hash==='#admin')openAdmin();
addEventListener('hashchange',()=>{if(location.hash==='#admin')openAdmin()});

function admRender(){
  const au=getAuth();
  if(!au)return adm.innerHTML=`<div class="login"><div class="fbox"><h2>ساخت رمز مدیر</h2><p class="note">اولین بار است که وارد پنل می‌شوید. یک رمز انتخاب کنید (حداقل ۶ کاراکتر).</p>
    <label class="f">رمز<input type="password" id="pw1" autocomplete="new-password"></label><label class="f">تکرار رمز<input type="password" id="pw2" autocomplete="new-password"></label>
    <div class="err" id="err"></div><div class="fact"><button class="btn" data-a="setup">ذخیره و ورود</button><button class="btn ghost" data-a="close">بستن</button></div></div></div>`;
  if(!A.authed)return adm.innerHTML=`<div class="login"><div class="fbox"><h2>ورود مدیر</h2>
    <label class="f">رمز<input type="password" id="pw" autocomplete="current-password"></label>
    <div class="err" id="err"></div><div class="fact"><button class="btn" data-a="login">ورود</button><button class="btn ghost" data-a="close">بستن</button></div></div></div>`;
  const tabs=[...Object.keys(SCHEMA).map(k=>[k,SCHEMA[k].label]),['settings','تنظیمات سایت'],['data','داده‌ها و رمز']];
  adm.innerHTML=`<div class="apanel"><div class="abar"><h2>پنل مدیریت</h2><button class="btn sm ghost" data-a="close">مشاهده سایت</button><button class="btn sm ghost" data-a="logout">خروج</button></div>
    <div class="tabs">${tabs.map(t=>`<button data-a="tab" data-t="${t[0]}" class="${A.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="tabBody"></div></div>`;
  const b=$('#tabBody');
  if(SCHEMA[A.tab])b.innerHTML=colHtml(A.tab);
  else if(A.tab==='settings')b.innerHTML=`<div class="fbox" id="fm">${SETTINGS_FIELDS.map(f=>fieldHtml(f,DATA.settings[f.k])).join('')}<div class="fact"><button class="btn" data-a="saveSettings">ذخیره تنظیمات</button></div></div>`;
  else b.innerHTML=dataHtml();
}
function colHtml(col){
  const S=SCHEMA[col],list=DATA[col];
  if(A.edit!==null){
    const it=A.edit==='new'?S.blank():list.find(x=>x.id===A.edit);
    return `<div class="fbox" id="fm" data-id="${esc(it.id)}"><h3>${A.edit==='new'?'افزودن':'ویرایش'}</h3>${S.fields.map(f=>fieldHtml(f,it[f.k])).join('')}<div class="err" id="err"></div><div class="fact"><button class="btn" data-a="saveItem">ذخیره</button><button class="btn ghost" data-a="cancel">انصراف</button></div></div>`;
  }
  return `<div class="fact" style="margin-bottom:16px"><button class="btn" data-a="new">+ افزودن</button></div>`+
    (list.length?list.map((it,i)=>`<div class="row ${it.visible===false?'off':''}"><div class="rt"><b>${esc(it[S.title]||'بدون عنوان')}</b><small>${esc(S.sub(it))}${it.visible===false?' — پنهان':''}</small></div><div class="ra">
      ${S.order?`<button data-a="up" data-i="${i}" ${i===0?'disabled':''} aria-label="بالا">▲</button><button data-a="down" data-i="${i}" ${i===list.length-1?'disabled':''} aria-label="پایین">▼</button>`:''}
      <button data-a="vis" data-i="${i}">${it.visible===false?'نمایش':'پنهان'}</button><button data-a="edit" data-i="${i}">ویرایش</button><button data-a="del" data-i="${i}">حذف</button></div></div>`).join(''):'<div class="empty">موردی وجود ندارد. با دکمهٔ «افزودن» شروع کنید.</div>');
}
function fieldHtml(f,v){
  const id='f_'+f.k;
  if(f.t==='check')return `<label class="chk"><input type="checkbox" name="${f.k}" ${v!==false&&v!==undefined?'checked':''}> ${f.l}</label>`;
  let inp;
  if(f.t==='textarea')inp=`<textarea name="${f.k}" id="${id}" rows="4">${esc(v)}</textarea>`;
  else if(f.t==='select')inp=`<select name="${f.k}" id="${id}">${f.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.t==='color')inp=`<input type="color" name="${f.k}" id="${id}" value="${esc(okColor(v))}">`;
  else if(f.t==='image')inp=`<div class="img-f"><input type="hidden" name="${f.k}" value="${esc(v)}"><div class="prev">${v?`<img src="${esc(okImg(v))}" alt="">`:'بدون تصویر'}</div>
    <input type="url" dir="ltr" placeholder="آدرس تصویر (https://…)" data-imgurl value="${v&&!String(v).startsWith('data:')?esc(v):''}">
    <div class="fact"><label class="btn sm ghost" style="cursor:pointer">انتخاب از دستگاه<input type="file" accept="image/*" data-imgfile hidden></label><button type="button" class="btn sm ghost" data-a="imgclear">حذف تصویر</button></div></div>`;
  else inp=`<input type="${f.t==='url'?'url':f.t==='date'?'date':f.t==='email'?'email':'text'}" name="${f.k}" id="${id}" value="${esc(v)}" ${f.t==='url'||f.t==='email'?'dir="ltr"':''}>`;
  return `<label class="f" ${f.t==='image'?'':`for="${id}"`}>${f.l}${f.t==='image'?'':inp}</label>${f.t==='image'?inp:''}`;
}
function dataHtml(){
  return `<div class="fbox"><h3>انتشار تغییرات</h3>
    <p class="note">تغییرات در همین مرورگر ذخیره می‌شود. برای اینکه همهٔ بازدیدکنندگان ببینند، فایل data.json را دانلود کنید و کنار index.html روی هاست بگذارید.</p>
    <div class="fact"><button class="btn" data-a="export">دانلود data.json</button><label class="btn ghost" style="cursor:pointer">بارگذاری data.json<input type="file" accept="application/json,.json" data-import hidden></label><button class="btn ghost" data-a="resetlocal">بازگشت به نسخهٔ منتشرشده</button></div></div>
    <div class="fbox" style="margin-top:18px"><h3>تغییر رمز</h3><label class="f">رمز فعلی<input type="password" id="op" autocomplete="current-password"></label>
    <label class="f">رمز جدید<input type="password" id="np" autocomplete="new-password"></label><div class="err" id="err"></div><div class="fact"><button class="btn" data-a="chpw">تغییر رمز</button></div></div>`;
}

/* ---------- admin: actions ---------- */
function collect(root,fields){
  const o={};fields.forEach(f=>{const el=root.querySelector(`[name="${f.k}"]`);if(!el)return;o[f.k]=f.t==='check'?el.checked:el.value.trim()});return o}
function readImg(file,max=1600){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;
  fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)})}
function setPrev(box,v){box.querySelector('[type=hidden]').value=v;box.querySelector('.prev').innerHTML=v?`<img src="${esc(okImg(v))}" alt="">`:'بدون تصویر'}

adm.addEventListener('input',e=>{
  if(e.target.matches('[data-imgurl]')){setPrev(e.target.closest('.img-f'),e.target.value.trim())}
});
adm.addEventListener('change',async e=>{
  const t=e.target;
  if(t.matches('[data-imgfile]')&&t.files[0]){const box=t.closest('.img-f');try{setPrev(box,await readImg(t.files[0]));box.querySelector('[data-imgurl]').value=''}catch(x){toast('تصویر خوانده نشد')}}
  if(t.matches('[data-import]')&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());if(!d||typeof d!=='object'||!(d.banners||d.news||d.projects||d.settings))throw 0;DATA=merge(d);save();admRender();toast('داده‌ها بارگذاری شد')}catch(x){toast('فایل معتبر نیست')}}
});
adm.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#pw'))act('login',e.target)});
adm.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b)});
let armTimer=null;
async function act(a,b){
  const col=A.tab,list=DATA[col],i=+b.dataset.i,err=m=>{const x=$('#err');if(x)x.textContent=m};
  switch(a){
    case 'close':return closeAdmin();
    case 'setup':{const p1=$('#pw1').value,p2=$('#pw2').value;if(p1.length<6)return err('رمز باید حداقل ۶ کاراکتر باشد');if(p1!==p2)return err('تکرار رمز مطابقت ندارد');
      const salt=uid()+uid();store.set(AUTHKEY,JSON.stringify({salt,hash:await hashPw(p1,salt)}));setSess(true);return admRender()}
    case 'login':{if(Date.now()<A.lock)return err('چند ثانیه صبر کنید و دوباره تلاش کنید');const au=getAuth();
      if(await hashPw($('#pw').value,au.salt)===au.hash){A.fails=0;setSess(true);return admRender()}
      if(++A.fails>=5){A.lock=Date.now()+30000;A.fails=0;return err('تلاش بیش از حد؛ ۳۰ ثانیه صبر کنید')}return err('رمز نادرست است')}
    case 'logout':setSess(false);return admRender();
    case 'tab':A.tab=b.dataset.t;A.edit=null;return admRender();
    case 'new':A.edit='new';return admRender();
    case 'edit':A.edit=list[i].id;return admRender();
    case 'cancel':A.edit=null;return admRender();
    case 'up':case 'down':{const j=a==='up'?i-1:i+1;[list[i],list[j]]=[list[j],list[i]];save();return admRender()}
    case 'vis':list[i].visible=list[i].visible===false;save();return admRender();
    case 'del':{if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='مطمئنی؟';clearTimeout(armTimer);armTimer=setTimeout(()=>admRender(),2500);return}
      list.splice(i,1);save();toast('حذف شد');return admRender()}
    case 'imgclear':{const box=b.closest('.img-f');setPrev(box,'');box.querySelector('[data-imgurl]').value='';return}
    case 'saveItem':{const S=SCHEMA[col],fm=$('#fm'),o=collect(fm,S.fields);
      const miss=S.fields.find(f=>f.r&&!o[f.k]);if(miss)return err('«'+miss.l+'» را پر کنید');
      o.id=fm.dataset.id;o.link=okUrl(o.link);
      if(A.edit==='new')list.push(o);else{const k=list.findIndex(x=>x.id===o.id);list[k]={...list[k],...o}}
      A.edit=null;save();toast('ذخیره شد');return admRender()}
    case 'saveSettings':{const o=collect($('#fm'),SETTINGS_FIELDS);if(!o.name)return toast('نام استودیو لازم است');Object.assign(DATA.settings,o);save();return toast('ذخیره شد')}
    case 'export':{const u=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='data.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
    case 'resetlocal':{store.del(KEY);await load();save();admRender();return toast('نسخهٔ منتشرشده بارگذاری شد')}
    case 'chpw':{const au=getAuth();if(await hashPw($('#op').value,au.salt)!==au.hash)return err('رمز فعلی نادرست است');const n=$('#np').value;if(n.length<6)return err('رمز جدید باید حداقل ۶ کاراکتر باشد');
      const salt=uid()+uid();store.set(AUTHKEY,JSON.stringify({salt,hash:await hashPw(n,salt)}));$('#op').value=$('#np').value='';return toast('رمز تغییر کرد')}
  }
}

load().then(render);
</script>
</body>
</html>
